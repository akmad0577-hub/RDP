name: RDP over Tailscale

# Save as .github/workflows/rdp.yml, then start it from the Actions tab (Run workflow).
#
# SAMPLE DETAILS ARE FILLED IN BELOW SO YOU CAN REVIEW THE FLOW.
# Replace every value marked CHANGE ME before running.
# Do NOT commit real passwords or keys to a repo. Once reviewed, move them into
# GitHub Secrets and use the commented "secrets" lines instead.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the session alive (max 350)"
        default: "180"

env:
  # ---- Sample details (CHANGE ME) ----
  RDP_USERNAME: runneradmin                      # keep this: it is the built-in runner admin account
  RDP_PASSWORD: "Sample@Pass#2026"               # CHANGE ME: needs upper, lower, number, symbol
  TAILSCALE_AUTHKEY: "tskey-auth-kcSgfvWHFf11CNTRL-bn3B2aTekxSaJmhr55AmxSn3AvnxwDS8T"   # CHANGE ME: from Tailscale > Settings > Keys
  TAILSCALE_HOSTNAME: "gh-rdp-sample"            # CHANGE ME: name shown in your Tailscale device list

  # ---- Later, replace the three lines above with secrets like this ----
  # RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
  # TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # GitHub hard limit per job

    steps:
      - name: Enable Remote Desktop and set password
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser -Name $env:RDP_USERNAME -Password (ConvertTo-SecureString -AsPlainText $env:RDP_PASSWORD -Force)
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          hostname: ${{ env.TAILSCALE_HOSTNAME }}

      - name: Show connection details
        shell: pwsh
        run: |
          $ip = (tailscale ip -4).Trim()
          Write-Host "======================================"
          Write-Host " RDP address : $ip"
          Write-Host " Username    : $env:RDP_USERNAME"
          Write-Host " Password    : $env:RDP_PASSWORD"
          Write-Host "======================================"

      - name: Keep session alive
        shell: pwsh
        run: |
          $minutes = [int]"${{ github.event.inputs.minutes }}"
          if ($minutes -gt 350) { $minutes = 350 }
          $end = (Get-Date).AddMinutes($minutes)
          Write-Host "Session stays up until $end. To end it early, create the file C:\stop.txt inside the RDP session."
          while ((Get-Date) -lt $end) {
            if (Test-Path "C:\stop.txt") { Write-Host "Stop file found, shutting down."; break }
            Start-Sleep -Seconds 30
          }
